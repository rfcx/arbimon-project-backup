name: test

on:
  push:
  pull_request:

# The scripts need nothing but the operating system. Python appears here ONLY to run the
# test harness (a local fake of Arbimon's servers); users never need it.
jobs:
  bash:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools that ship with the OS
        run: |
          /bin/bash --version | head -1
          curl --version | head -1
      - name: Syntax check with the system bash (macOS = bash 3.2)
        run: /bin/bash -n arbimon_backup_download.sh
      - name: Behaviour tests (bash script)
        run: python3 -m unittest discover -s tests -v
      - name: Script prints its version
        run: bash arbimon_backup_download.sh --version

  windows-powershell-5:
    # Windows PowerShell 5.1: what every Windows 10/11 has out of the box
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Tools that ship with Windows
        run: |
          $PSVersionTable.PSVersion.ToString()
          (Get-Command curl.exe).Source
          curl.exe --version | Select-Object -First 1
      - name: Behaviour tests (PowerShell script)
        env:
          ABD_SCRIPT: ps1
          ABD_PWSH: powershell
        run: python -m unittest discover -s tests -v
      - name: Script prints its version
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\arbimon_backup_download.ps1 -Version

  windows-powershell-7:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          $PSVersionTable.PSVersion.ToString()
          curl.exe --version | Select-Object -First 1
      - name: Behaviour tests (PowerShell script)
        env:
          ABD_SCRIPT: ps1
          ABD_PWSH: pwsh
        run: python -m unittest discover -s tests -v